# Theme SIPETA

[theme]
base = "light"
primaryColor = "#0E7C7B"
backgroundColor = "#F3F5F4"
secondaryBackgroundColor = "#E7EBED"
textColor = "#1E2A32"
linkColor = "#0E7C7B"
borderColor = "#C3CCD2"
baseRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 15
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
headingFontSizes = ["1.9rem", "1.35rem", "1.1rem", "1rem", "0.9rem", "0.8rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#00908A", "#B8552F", "#5B6B7A", "#C9A227", "#3D5A80", "#6FA868"]

[theme.sidebar]
backgroundColor = "#DCE1E4"
secondaryBackgroundColor = "#CBD2D7"
borderColor = "#B4BEC5"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
